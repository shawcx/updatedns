[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "updatedns"
dynamic = ["version"]
description = "Command-Line Cloud DNS utility"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matthew Shaw", email = "mshaw.cx@gmail.com"}]
requires-python = ">=3.8"
dependencies = ["apache-libcloud>=3.0"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://shaw.cx/updatedns"

[project.scripts]
updatedns = "updatedns.updatedns:main"

[tool.setuptools]
packages = ["updatedns"]

[tool.setuptools.package-data]
updatedns = ["updatedns.service", "updatedns-*"]

[tool.setuptools.dynamic]
version = {attr = "updatedns.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
